<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Heaven — Restaurant Management System</title>
  <meta name="description" content="Restaurant Menu & Order Management System — Web Technologies Project" />

  <!-- ── FONTS ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />

  <!-- ── STYLESHEETS ── -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />

  <!-- ── SQL.js (SQLite → WebAssembly) ── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
</head>
<body>

  <!-- ══════════════════════════════════
       HEADER — sticky navigation bar
  ══════════════════════════════════ -->
  <header id="app-header">
    <div class="logo">
      <span class="logo-name">Food Heaven</span>
      <span class="logo-tag">Restaurant System</span>
    </div>
    <nav id="main-nav">
      <button class="nav-btn" data-page="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-btn" data-page="menu">
        <span class="nav-icon">🍽</span>
        <span class="nav-label">Menu</span>
      </button>
      <button class="nav-btn" data-page="orders">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Orders</span>
      </button>
      <button class="nav-btn" data-page="reports">
        <span class="nav-icon">📈</span>
        <span class="nav-label">Reports</span>
      </button>
    </nav>
  </header>

  <!-- ══════════════════════════════════
       MAIN — page content injected here
  ══════════════════════════════════ -->
  <main id="app-content">
    <!-- Pages are dynamically injected by app.js after DB init -->
  </main>

  <!-- ══════════════════════════════════
       MODALS — injected by app.js
  ══════════════════════════════════ -->
  <div id="modals-container"></div>

  <!-- ══════════════════════════════════
       TOAST NOTIFICATION
  ══════════════════════════════════ -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ══════════════════════════════════
       JAVASCRIPT — load order matters
       1. database.js  — DB engine & helpers
       2. utils.js     — shared utilities
       3. dashboard.js — dashboard page
       4. menu.js      — menu CRUD
       5. orders.js    — orders CRUD
       6. reports.js   — analytics
       7. app.js       — bootstrap (runs last)
  ══════════════════════════════════ -->
  <script src="js/database.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
